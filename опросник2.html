<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конструктор юридических документов</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 750px; margin: 30px auto; padding: 20px; background: #fafafa; }
        h1 { font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #666; margin-bottom: 10px; }
        .tabs { display: flex; gap: 0; margin-bottom: 25px; border-radius: 8px; overflow: hidden; }
        .tab { flex: 1; padding: 14px; text-align: center; cursor: pointer; font-weight: bold; font-size: 15px; background: #e9ecef; color: #555; border: none; transition: 0.2s; }
        .tab.active { background: #0070f3; color: white; }
        .tab:hover:not(.active) { background: #dee2e6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        textarea { height: 80px; resize: vertical; }
        button { margin-top: 15px; padding: 14px; font-size: 17px; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-ai { background: #0070f3; }
        .btn-ai:hover { background: #0050c0; }
        .btn-ai:disabled { background: #999; cursor: not-allowed; }
        .btn-ocr { background: #6c757d; }
        .btn-ocr:hover { background: #545b62; }
        .btn-ocr:disabled { background: #999; cursor: not-allowed; }
        .btn-pdf { background: #28a745; }
        .btn-pdf:hover { background: #1e7e34; }
        .btn-pdf:disabled { background: #999; cursor: not-allowed; }
        .result { margin-top: 25px; padding: 25px; background: white; border-radius: 6px; white-space: pre-wrap; font-size: 14px; line-height: 1.7; border: 1px solid #e0e0e0; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .error { color: #d00; }
        #status { margin-top: 10px; font-size: 14px; color: #666; min-height: 20px; }
        .file-info { font-size: 14px; color: #333; margin-top: 8px; }
        hr { margin: 25px 0; border: none; border-top: 1px solid #ddd; }
        .section-title { font-size: 16px; font-weight: bold; color: #333; margin-top: 20px; }
        .history { margin-top: 30px; }
        .history-item { background: white; padding: 12px 15px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #e0e0e0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .history-item:hover { background: #f0f4ff; }
        .history-item .doc-info { flex: 1; }
        .history-item .doc-date { font-size: 12px; color: #888; }
        .history-item .doc-type { font-weight: bold; }
        .history-item .doc-preview { font-size: 13px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 400px; }
        .history-item .doc-delete { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; width: auto; }
        .history-item .doc-delete:hover { background: #b02a37; }
        .autofill-badge { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 2px 8px; border-radius: 10px; font-size: 12px; margin-left: 8px; }
    </style>
</head>
<body>

    <h1>⚖️ Конструктор юридических документов</h1>
    <p class="subtitle">Выберите режим и получите готовый документ за 1 минуту.</p>

    <!-- ВКЛАДКИ -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('incoming')">📥 Мне прислали документ</button>
        <button class="tab" onclick="switchTab('outgoing')">✍️ Я хочу составить документ</button>
    </div>

    <!-- ==================== ВКЛАДКА 1: ВХОДЯЩИЙ ДОКУМЕНТ ==================== -->
    <div id="tab-incoming" class="tab-content active">

        <div class="section-title">📎 Загрузите входящий документ (фото или PDF) — поля заполнятся автоматически</div>

        <label>Файл (jpg, png, pdf)</label>
        <input type="file" id="uploadedFile" accept=".jpg,.jpeg,.png,.pdf" style="padding:8px;">

        <button class="btn-ocr" onclick="readFile()" id="btnOcr">🔍 Распознать текст из файла</button>
        <div class="file-info" id="fileInfo"></div>

        <label>Распознанный текст (можно отредактировать)</label>
        <textarea id="recognizedText" placeholder="Здесь появится текст из файла после нажатия «Распознать»." style="height:130px;"></textarea>

        <hr>

        <label>Кто прислал документ (отправитель) <span id="autoBadge1"></span></label>
        <input id="inc_sender" placeholder="Иванов Иван Иванович">

        <label>Кому адресован (вы) <span id="autoBadge2"></span></label>
        <input id="inc_receiver" placeholder="ООО «Ваша компания»">

        <label>Ваш адрес</label>
        <input id="inc_address" placeholder="г. Москва, ул. Примерная, д. 1">

        <label>Дата входящего документа <span id="autoBadge3"></span></label>
        <input id="inc_date" type="date" value="2026-05-15">

        <label>Суть требований (что от вас хотят) <span id="autoBadge4"></span></label>
        <textarea id="inc_demands" placeholder="Опишите кратко: что требует заявитель, на каком основании."></textarea>

        <label>Сумма требований (если указана) <span id="autoBadge5"></span></label>
        <input id="inc_sum" placeholder="Например: 50000">

        <label>Ваша позиция (согласны / не согласны / частично)</label>
        <textarea id="inc_position" placeholder="Например: не согласны, потому что... Или: готовы удовлетворить частично в размере..."></textarea>

    </div>

    <!-- ==================== ВКЛАДКА 2: ИСХОДЯЩИЙ ДОКУМЕНТ ==================== -->
    <div id="tab-outgoing" class="tab-content">

        <label>Тип документа</label>
        <select id="out_docType">
            <option value="claim">Претензия (возврат товара / услуги)</option>
            <option value="lawsuit">Исковое заявление в суд</option>
            <option value="response">Ответ на претензию</option>
            <option value="rpn">Жалоба в Роспотребнадзор</option>
            <option value="motion">Ходатайство в суд</option>
            <option value="objection">Возражение на судебный приказ</option>
            <option value="penalty">Заявление о взыскании неустойки</option>
            <option value="labor">Трудовой спор</option>
        </select>

        <label>Ваше ФИО (или название организации)</label>
        <input id="out_myName" placeholder="Иванов Иван Иванович">

        <label>Ваш адрес</label>
        <input id="out_myAddress" placeholder="г. Москва, ул. Примерная, д. 1, кв. 1">

        <label>Кому адресован документ</label>
        <input id="out_opponent" placeholder="ООО «Мир обуви»">

        <label>Дата события</label>
        <input id="out_date" type="date" value="2026-05-15">

        <label>Опишите ситуацию</label>
        <textarea id="out_situation" placeholder="Опишите, что произошло: кто, когда, что сделал или не сделал."></textarea>

        <label>Сумма требований (если есть)</label>
        <input id="out_price" placeholder="Например: 5000">

        <label>Чего хотите добиться?</label>
        <input id="out_goal" placeholder="Например: вернуть деньги, отменить приказ, взыскать неустойку">

        <label>Доказательства</label>
        <select id="out_evidence">
            <option value="receipt">Есть чек</option>
            <option value="bank">Выписка из банка</option>
            <option value="witness">Свидетели</option>
            <option value="photo">Фото / видео</option>
            <option value="multiple">Чек + фото + свидетели</option>
            <option value="none">Нет доказательств</option>
        </select>

    </div>

    <!-- ==================== ОБЩИЕ КНОПКИ ==================== -->
    <hr>

    <input type="hidden" id="apiKey" value="ВАШ_КЛЮЧ_СЮДА">

    <button class="btn-ai" onclick="askAI()" id="btnAi">⚡ Сформировать документ</button>
    <button class="btn-pdf" onclick="downloadPDF()" id="btnPdf" disabled>📄 Скачать PDF</button>

    <div id="status"></div>
    <div id="result" class="result" style="display:none;"></div>

    <hr>
    <div class="section-title">📋 Ваши документы</div>
    <div id="history" class="history"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        let lastDocument = '';
        let activeTab = 'incoming';
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // ========== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ==========
        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if (tab === 'incoming') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('tab-incoming').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('tab-outgoing').classList.add('active');
            }
            document.getElementById('status').textContent = '';
            document.getElementById('result').style.display = 'none';
        }

        // ========== ИСТОРИЯ ==========
        function saveToHistory(docText, docType) {
            let history = JSON.parse(localStorage.getItem('docHistory') || '[]');
            let docNamesShort = {
                claim: 'Претензия', lawsuit: 'Иск', response: 'Ответ на претензию',
                rpn: 'Жалоба в РПН', motion: 'Ходатайство', objection: 'Возражение',
                penalty: 'Неустойка', labor: 'Трудовой спор'
            };
            history.unshift({
                date: new Date().toLocaleString('ru-RU'),
                type: docNamesShort[docType] || docType,
                text: docText,
                preview: docText.substring(0, 120).replace(/\n/g, ' ')
            });
            if (history.length > 20) history = history.slice(0, 20);
            localStorage.setItem('docHistory', JSON.stringify(history));
            showHistory();
        }

        function showHistory() {
            let historyDiv = document.getElementById('history');
            let history = JSON.parse(localStorage.getItem('docHistory') || '[]');
            if (history.length === 0) {
                historyDiv.innerHTML = '<p style="color:#888;">Пока нет сохранённых документов.</p>';
                return;
            }
            historyDiv.innerHTML = history.map((doc, i) => `
                <div class="history-item">
                    <div class="doc-info" onclick="openHistoryItem(${i})">
                        <div class="doc-type">${doc.type}</div>
                        <div class="doc-date">${doc.date}</div>
                        <div class="doc-preview">${doc.preview}...</div>
                    </div>
                    <button class="doc-delete" onclick="deleteHistoryItem(${i}); event.stopPropagation();">Удалить</button>
                </div>
            `).join('');
        }

        function openHistoryItem(index) {
            let history = JSON.parse(localStorage.getItem('docHistory') || '[]');
            if (history[index]) {
                lastDocument = history[index].text;
                let result = document.getElementById('result');
                result.textContent = lastDocument;
                result.style.display = 'block';
                document.getElementById('btnPdf').disabled = false;
                document.getElementById('status').textContent = '📂 Открыт сохранённый документ от ' + history[index].date;
                window.scrollTo({ top: result.offsetTop - 30, behavior: 'smooth' });
            }
        }

        function deleteHistoryItem(index) {
            if (confirm('Удалить этот документ из истории?')) {
                let history = JSON.parse(localStorage.getItem('docHistory') || '[]');
                history.splice(index, 1);
                localStorage.setItem('docHistory', JSON.stringify(history));
                showHistory();
            }
        }

        showHistory();

        // ========== ПРЕДОБРАБОТКА ==========
        function preprocessImage(file) {
            return new Promise((resolve) => {
                let img = new Image();
                let url = URL.createObjectURL(file);
                img.onload = function() {
                    let canvas = document.createElement('canvas');
                    let ctx = canvas.getContext('2d');
                    let scale = Math.min(2000 / img.width, 2);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    let data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        let gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                        let bw = gray < 140 ? 0 : 255;
                        if (gray < 100) bw = 0;
                        if (gray > 180) bw = 255;
                        data[i] = bw; data[i + 1] = bw; data[i + 2] = bw;
                    }
                    ctx.putImageData(imageData, 0, 0);
                    canvas.toBlob(function(blob) { resolve(URL.createObjectURL(blob)); }, 'image/png');
                    URL.revokeObjectURL(url);
                };
                img.src = url;
            });
        }

        // ========== АВТОЗАПОЛНЕНИЕ ==========
        function clearAutoBadges() {
            for (let i = 1; i <= 5; i++) {
                let b = document.getElementById('autoBadge' + i);
                if (b) b.innerHTML = '';
            }
        }

        function autoFillForm(text) {
            clearAutoBadges();
            let filled = [];

            // Отправитель
            let senderPatterns = [
                /(?:от|От)\s*[«"]([^«»"]+)[»"]/,
                /(?:Заявитель|Истец|Потребитель|Покупатель|Клиент)[:\s]+([^\n]+)/i,
                /(?:ФИО|Ф\.И\.О\.)[:\s]+([^\n]+)/i,
                /^([А-ЯЁ][а-яё]+\s[А-ЯЁ][а-яё]+\s[А-ЯЁ][а-яё]+)/m
            ];
            for (let p of senderPatterns) {
                let m = text.match(p);
                if (m && m[1] && m[1].trim().length > 5) {
                    document.getElementById('inc_sender').value = m[1].trim();
                    document.getElementById('autoBadge1').innerHTML = '<span class="autofill-badge">авто</span>';
                    filled.push('отправитель');
                    break;
                }
            }

            // Получатель
            let receiverPatterns = [
                /(?:Кому|В адрес|Получатель|Адресат)[:\s]+([^\n]+)/i,
                /(?:ООО|ИП|АО|ЗАО)\s*[«"]([^«»"]+)[»"]/,
                /(?:в отношении|в лице)\s+([^\n,]+)/i
            ];
            for (let p of receiverPatterns) {
                let m = text.match(p);
                if (m && m[1] && m[1].trim().length > 5) {
                    document.getElementById('inc_receiver').value = m[1].trim();
                    document.getElementById('autoBadge2').innerHTML = '<span class="autofill-badge">авто</span>';
                    filled.push('получатель');
                    break;
                }
            }

            // Дата
            let datePatterns = [
                /(?:от|дата|Дата)[:\s]+(\d{1,2}[./]\d{1,2}[./]\d{2,4})/,
                /(\d{1,2}[./]\d{1,2}[./]\d{2,4})\s*(?:года|г\.)?/
            ];
            for (let p of datePatterns) {
                let m = text.match(p);
                if (m && m[1]) {
                    let ds = m[1].replace(/\./g, '-');
                    let parts = ds.split('-');
                    if (parts[0] && parts[1] && parts[2]) {
                        if (parts[2].length === 2) parts[2] = '20' + parts[2];
                        document.getElementById('inc_date').value = parts[2] + '-' + parts[1].padStart(2,'0') + '-' + parts[0].padStart(2,'0');
                        document.getElementById('autoBadge3').innerHTML = '<span class="autofill-badge">авто</span>';
                        filled.push('дата');
                        break;
                    }
                }
            }

            // Сумма
            let sumPatterns = [
                /(?:сумм[ауе]|стоимость|в размере|уплаченную)\s*[:\s]+(\d[\d\s]*)\s*(?:руб|₽|р\.)/i,
                /(\d[\d\s]*)\s*(?:руб|₽|р\.)/
            ];
            for (let p of sumPatterns) {
                let m = text.match(p);
                if (m && m[1]) {
                    let sum = m[1].replace(/\s/g, '');
                    if (parseInt(sum) > 10) {
                        document.getElementById('inc_sum').value = sum;
                        document.getElementById('autoBadge5').innerHTML = '<span class="autofill-badge">авто</span>';
                        filled.push('сумма');
                        break;
                    }
                }
            }

            // Суть требований
            if (filled.length >= 2) {
                document.getElementById('inc_demands').value = 'Из текста претензии: ' + text.substring(0, 300).replace(/\n/g, ' ').trim() + '...';
                document.getElementById('autoBadge4').innerHTML = '<span class="autofill-badge">авто</span>';
                document.getElementById('inc_position').value = 'Прошу составить мотивированный ответ.';
            }

            if (filled.length > 0) {
                document.getElementById('fileInfo').textContent += ' | Автозаполнено: ' + filled.join(', ') + '. Проверьте поля.';
            }
        }

        // ========== ЧТЕНИЕ ФАЙЛА ==========
        async function readFile() {
            let fileInput = document.getElementById('uploadedFile');
            let fileInfo = document.getElementById('fileInfo');
            let recognizedText = document.getElementById('recognizedText');
            let btnOcr = document.getElementById('btnOcr');

            if (!fileInput.files[0]) {
                fileInfo.innerHTML = '<span class="error">Сначала выберите файл.</span>';
                return;
            }

            let file = fileInput.files[0];
            fileInfo.textContent = 'Читаю файл: ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' КБ)...';
            btnOcr.disabled = true;

            try {
                let text = '';

                if (file.type === 'application/pdf') {
                    let arrayBuffer = await file.arrayBuffer();
                    let pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let pages = [];
                    for (let i = 1; i <= pdf.numPages; i++) {
                        fileInfo.textContent = 'Обрабатываю страницу ' + i + ' из ' + pdf.numPages + '...';
                        let page = await pdf.getPage(i);
                        let viewport = page.getViewport({ scale: 2.5 });
                        let canvas = document.createElement('canvas');
                        let ctx = canvas.getContext('2d');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                        let blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                        let processedUrl = await preprocessImage(blob);
                        let result = await Tesseract.recognize(processedUrl, 'rus+eng', {
                            logger: m => {
                                if (m.status === 'recognizing text') {
                                    fileInfo.textContent = 'Страница ' + i + ': распознаю... ' + Math.round(m.progress * 100) + '%';
                                }
                            }
                        });
                        pages.push(result.data.text);
                        URL.revokeObjectURL(processedUrl);
                    }
                    text = pages.join('\n\n');
                } else {
                    let processedImageUrl = await preprocessImage(file);
                    let result = await Tesseract.recognize(processedImageUrl, 'rus+eng', {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                fileInfo.textContent = 'Распознаю... ' + Math.round(m.progress * 100) + '%';
                            }
                        }
                    });
                    text = result.data.text;
                    URL.revokeObjectURL(processedImageUrl);
                }

                recognizedText.value = text.trim();
                fileInfo.textContent = '✅ Готово. Распознано ' + text.length + ' символов.';
                autoFillForm(text);

            } catch (err) {
                fileInfo.innerHTML = '<span class="error">Ошибка чтения файла: ' + err.message + '</span>';
            }

            btnOcr.disabled = false;
        }

        // ========== ОТПРАВКА ==========
        async function askAI() {
            let btnAi = document.getElementById('btnAi');
            let btnPdf = document.getElementById('btnPdf');
            let status = document.getElementById('status');
            let result = document.getElementById('result');

            btnAi.disabled = true;
            btnPdf.disabled = true;
            btnAi.textContent = 'Составляем документ...';
            status.textContent = '';
            result.style.display = 'none';
            lastDocument = '';

            let docType, fullContext;

            if (activeTab === 'incoming') {
                // Режим входящего документа — всегда ответ на претензию
                docType = 'response';
                let incText = document.getElementById('recognizedText').value.trim();

                fullContext = `Составь ответ на претензию на основе следующих данных:

=== ДАННЫЕ ОТВЕТЧИКА ===
- Отправитель претензии: ${document.getElementById('inc_sender').value}
- Получатель (вы): ${document.getElementById('inc_receiver').value}
- Адрес: ${document.getElementById('inc_address').value}
- Дата входящего документа: ${document.getElementById('inc_date').value}

=== СУТЬ ПРЕТЕНЗИИ ===
${document.getElementById('inc_demands').value || '(не указана)'}

=== СУММА ТРЕБОВАНИЙ ===
${document.getElementById('inc_sum').value || 'не указана'} руб.

=== ТЕКСТ ВХОДЯЩЕГО ДОКУМЕНТА ===
${incText || '(не загружен)'}

=== ПОЗИЦИЯ (ЧТО ОТВЕЧАЕМ) ===
${document.getElementById('inc_position').value || 'Прошу составить мотивированный ответ.'}`;

            } else {
                // Режим исходящего документа
                docType = document.getElementById('out_docType').value;
                let evidenceText = {
                    receipt: 'чек имеется', bank: 'выписка из банка', witness: 'свидетели',
                    photo: 'фото/видео', multiple: 'чек + фото + свидетели', none: 'нет доказательств'
                }[document.getElementById('out_evidence').value];

                let docNames = {
                    claim: 'претензию', lawsuit: 'исковое заявление', response: 'ответ на претензию',
                    rpn: 'жалобу в Роспотребнадзор', motion: 'ходатайство', objection: 'возражение на судебный приказ',
                    penalty: 'заявление о взыскании неустойки', labor: 'заявление по трудовому спору'
                };

                fullContext = `Составь ${docNames[docType]} на основе следующих данных:

=== ДАННЫЕ ЗАЯВИТЕЛЯ ===
- ФИО: ${document.getElementById('out_myName').value}
- Адрес: ${document.getElementById('out_myAddress').value}
- Адресат: ${document.getElementById('out_opponent').value}
- Дата события: ${document.getElementById('out_date').value}

=== ОПИСАНИЕ СИТУАЦИИ ===
${document.getElementById('out_situation').value || '(не указано)'}

=== ТРЕБОВАНИЯ ===
- Сумма: ${document.getElementById('out_price').value || 'не указана'} руб.
- Цель: ${document.getElementById('out_goal').value || 'урегулировать спор'}
- Доказательства: ${evidenceText}`;
            }

            fullContext += `\n\nИспользуй ТОЛЬКО статьи закона из системного промпта. Если данных недостаточно — добавь раздел «РИСКИ». Начинай сразу с текста документа, без вступлений.`;

            try {
                let apiKey = document.getElementById('apiKey').value.trim();
                if (!apiKey || !apiKey.startsWith('sk-')) {
                    throw new Error('API-ключ не настроен.');
                }

                let response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [{
                            role: 'system',
                            content: `# РОЛЬ\nТы — юридический конструктор документов для граждан РФ. Составляешь проекты юридических документов на основе ФАКТОВ.\n\n# ПРАВИЛА\n1. Ссылайся ТОЛЬКО на статьи: ЗоЗПП 18-29, ГК 309-310-330-395-1064, ГПК 35-57-131-132-166-167, КоАП 14.8, ТК 142-236-392, Пленум ВС №17.\n2. Не придумывай адреса и реквизиты.\n3. Только документ, без консультаций.\n4. Структура: шапка, описание, мотивировка, требования, приложения.\n5. При недостатке данных — раздел «РИСКИ».\n6. Официально-деловой стиль.\n\n# ФОРМАТ\nНачинай сразу с заголовка. После — кратко: статьи, нехватка данных, риски.`
                        }, {
                            role: 'user',
                            content: fullContext
                        }],
                        temperature: 0.3,
                        max_tokens: 3000
                    })
                });

                if (!response.ok) { let err = await response.json(); throw new Error(err.error?.message || 'Ошибка: ' + response.status); }

                let json = await response.json();
                lastDocument = json.choices[0].message.content;
                result.textContent = lastDocument;
                result.style.display = 'block';
                btnPdf.disabled = false;
                status.textContent = '✅ Документ готов. Можете скачать PDF.';
                saveToHistory(lastDocument, docType);

            } catch (error) {
                status.innerHTML = '<span class="error">Ошибка: ' + error.message + '</span>';
            }

            btnAi.disabled = false;
            btnAi.textContent = '⚡ Сформировать документ';
        }

        // ========== PDF ==========
        function downloadPDF() {
            if (!lastDocument) return;
            let printWindow = window.open('', '_blank', 'width=800,height=600');
            printWindow.document.write('<html><head><meta charset="UTF-8"><style>body{font-family:"Times New Roman",serif;font-size:14pt;line-height:1.5;padding:30px 40px;white-space:pre-wrap;}</style></head><body>');
            printWindow.document.write(lastDocument.replace(/\n/g, '<br>'));
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            printWindow.focus();
            setTimeout(() => printWindow.print(), 500);
        }
    </script>

</body>
