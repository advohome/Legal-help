<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Юридический помощник</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 750px; margin: 30px auto; padding: 20px; background: #fafafa; }
        h1 { font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #666; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        textarea { height: 80px; resize: vertical; }
        button { margin-top: 15px; padding: 14px; font-size: 17px; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-ai { background: #0070f3; }
        .btn-ai:hover { background: #0050c0; }
        .btn-ai:disabled { background: #999; cursor: not-allowed; }
        .btn-ocr { background: #6c757d; }
        .btn-ocr:hover { background: #545b62; }
        .btn-ocr:disabled { background: #999; cursor: not-allowed; }
        .btn-pdf { background: #28a745; }
        .btn-pdf:hover { background: #1e7e34; }
        .btn-pdf:disabled { background: #999; cursor: not-allowed; }
        .result { margin-top: 25px; padding: 25px; background: white; border-radius: 6px; white-space: pre-wrap; font-size: 14px; line-height: 1.7; border: 1px solid #e0e0e0; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .error { color: #d00; }
        #status { margin-top: 10px; font-size: 14px; color: #666; min-height: 20px; }
        .note { font-size: 13px; color: #888; margin-top: 3px; }
        .file-info { font-size: 14px; color: #333; margin-top: 8px; }
        hr { margin: 25px 0; border: none; border-top: 1px solid #ddd; }
        .section-title { font-size: 16px; font-weight: bold; color: #333; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>⚖️ Юридический помощник</h1>
    <p class="subtitle">Загрузите документ или опишите ситуацию — ИИ составит ответ.</p>

    <label>Тип документа</label>
    <select id="docType">
        <option value="claim">Претензия (возврат товара / услуги)</option>
        <option value="lawsuit">Исковое заявление в суд</option>
        <option value="response">Ответ на претензию (если вам предъявили)</option>
        <option value="rpn">Жалоба в Роспотребнадзор</option>
    </select>

    <label>Ваше ФИО (или название организации)</label>
    <input id="myName" placeholder="Иванов Иван Иванович">

    <label>Ваш адрес</label>
    <input id="myAddress" placeholder="г. Москва, ул. Примерная, д. 1, кв. 1">

    <label>Кому адресован документ (магазин, ИП, организация)</label>
    <input id="opponent" placeholder="ООО «Мир обуви»">

    <label>Дата события</label>
    <input id="date" type="date" value="2026-05-01">

    <label>Опишите ситуацию</label>
    <textarea id="situation" placeholder="Опишите, что произошло: кто, когда, что сделал или не сделал. Это станет основой документа."></textarea>

    <label>Сумма требований (если есть)</label>
    <input id="price" placeholder="Например: 5000">

    <label>Чего хотите добиться?</label>
    <input id="goal" placeholder="Например: вернуть деньги, отклонить претензию, провести проверку">

    <label>Доказательства</label>
    <select id="evidence">
        <option value="receipt">Есть чек</option>
        <option value="bank">Выписка из банка</option>
        <option value="witness">Свидетели (чека нет)</option>
        <option value="photo">Фото / видео дефекта</option>
        <option value="multiple">Чек + фото + свидетели</option>
        <option value="none">Нет доказательств</option>
    </select>

    <hr>

    <div class="section-title">📎 Загрузите файл (фото или PDF чужой претензии)</div>

    <label>Файл претензии (jpg, png, pdf)</label>
    <input type="file" id="uploadedFile" accept=".jpg,.jpeg,.png,.pdf" style="padding:8px;">

    <button class="btn-ocr" onclick="readFile()" id="btnOcr">🔍 Распознать текст из файла</button>
    <div class="file-info" id="fileInfo"></div>

    <label>Распознанный текст (можно отредактировать)</label>
    <textarea id="recognizedText" placeholder="Здесь появится текст из загруженного файла после нажатия «Распознать»." style="height:120px;"></textarea>

    <label>Ваш ответ или позиция по претензии</label>
    <textarea id="yourPosition" placeholder="Например: я не согласен с претензией, потому что... Или: я согласен частично и готов..."></textarea>

    <hr>

    <input type="hidden" id="apiKey" value="sk-f6e401b63a4547a1ae1ca864ef35bbdc">

    <button class="btn-ai" onclick="askAI()" id="btnAi">⚡ Сформировать документ через ИИ</button>
    <button class="btn-pdf" onclick="downloadPDF()" id="btnPdf" disabled>📄 Скачать PDF</button>

    <div id="status"></div>
    <div id="result" class="result" style="display:none;"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        let lastDocument = '';
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        async function readFile() {
            let fileInput = document.getElementById('uploadedFile');
            let fileInfo = document.getElementById('fileInfo');
            let recognizedText = document.getElementById('recognizedText');
            let btnOcr = document.getElementById('btnOcr');

            if (!fileInput.files[0]) {
                fileInfo.innerHTML = '<span class="error">Сначала выберите файл.</span>';
                return;
            }

            let file = fileInput.files[0];
            fileInfo.textContent = 'Читаю файл: ' + file.name + ' (' + (file.size / 1024).toFixed(1) + ' КБ)...';
            btnOcr.disabled = true;

            try {
                let text = '';

                if (file.type === 'application/pdf') {
                    let arrayBuffer = await file.arrayBuffer();
                    let pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let pages = [];
                    for (let i = 1; i <= pdf.numPages; i++) {
                        let page = await pdf.getPage(i);
                        let content = await page.getTextContent();
                        let pageText = content.items.map(item => item.str).join(' ');
                        pages.push(pageText);
                    }
                    text = pages.join('\n\n');
                } else {
                    let imageUrl = URL.createObjectURL(file);
                    let result = await Tesseract.recognize(imageUrl, 'rus+eng', {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                fileInfo.textContent = 'Распознаю... ' + Math.round(m.progress * 100) + '%';
                            }
                        }
                    });
                    text = result.data.text;
                    URL.revokeObjectURL(imageUrl);
                }

                recognizedText.value = text.trim();
                fileInfo.textContent = '✅ Готово. Распознано ' + text.length + ' символов. Проверьте текст и отредактируйте при необходимости.';

            } catch (err) {
                fileInfo.innerHTML = '<span class="error">Ошибка чтения файла: ' + err.message + '</span>';
            }

            btnOcr.disabled = false;
        }

        async function askAI() {
            let btnAi = document.getElementById('btnAi');
            let btnPdf = document.getElementById('btnPdf');
            let status = document.getElementById('status');
            let result = document.getElementById('result');

            btnAi.disabled = true;
            btnPdf.disabled = true;
            btnAi.textContent = 'ИИ составляет документ...';
            status.textContent = '';
            result.style.display = 'none';
            lastDocument = '';

            let docType = document.getElementById('docType').value;
            let recognizedText = document.getElementById('recognizedText').value.trim();
            let yourPosition = document.getElementById('yourPosition').value.trim();

            let data = {
                docType: docType,
                myName: document.getElementById('myName').value,
                myAddress: document.getElementById('myAddress').value,
                opponent: document.getElementById('opponent').value,
                date: document.getElementById('date').value,
                situation: document.getElementById('situation').value,
                price: document.getElementById('price').value || 'не указана',
                goal: document.getElementById('goal').value || 'урегулировать спор',
                evidence: document.getElementById('evidence').value
            };

            if (!data.myName) {
                status.innerHTML = '<span class="error">Заполните минимум: «Ваше ФИО».</span>';
                btnAi.disabled = false;
                btnAi.textContent = '⚡ Сформировать документ через ИИ';
                return;
            }

            let evidenceText = {
                receipt: 'чек имеется',
                bank: 'оплата подтверждается выпиской из банка',
                witness: 'чек утерян, есть свидетели',
                photo: 'имеются фото/видео дефекта',
                multiple: 'чек, фото дефекта и свидетели',
                none: 'доказательства отсутствуют'
            }[data.evidence];

            let docNames = {
                claim: 'претензию',
                lawsuit: 'исковое заявление в суд',
                response: 'ответ на претензию',
                rpn: 'жалобу в Роспотребнадзор'
            };

            let fullContext = `Составь ${docNames[docType]} на основе следующих данных:

=== ДАННЫЕ ЗАЯВИТЕЛЯ ===
- ФИО: ${data.myName}
- Адрес: ${data.myAddress}
- Адресат: ${data.opponent}
- Дата события: ${data.date}

=== ОПИСАНИЕ СИТУАЦИИ ===
${data.situation || '(не указано)'}

=== ТРЕБОВАНИЯ ===
- Сумма: ${data.price} руб.
- Цель: ${data.goal}
- Доказательства: ${evidenceText}`;

            if (recognizedText) {
                fullContext += `\n\n=== ТЕКСТ ВХОДЯЩЕГО ДОКУМЕНТА ===\n${recognizedText}`;
            }

            if (yourPosition) {
                fullContext += `\n\n=== ПОЗИЦИЯ ЗАЯВИТЕЛЯ ===\n${yourPosition}`;
            }

            fullContext += `\n\nИспользуй ТОЛЬКО статьи закона из системного промпта. Если данных недостаточно — добавь раздел «РИСКИ». Начинай сразу с текста документа, без вступлений.`;

            try {
                let apiKey = document.getElementById('apiKey').value.trim();
                if (!apiKey || !apiKey.startsWith('sk-')) {
                    throw new Error('API-ключ не настроен. Откройте файл в Блокноте и вставьте ваш ключ в строку value="ВАШ_КЛЮЧ_СЮДА".');
                }

                let response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            {
                                role: 'system',
                                content: `# РОЛЬ
Ты — юридический ассистент для граждан РФ. Твоя функция: составлять проекты юридических документов (претензии, иски, ответы на претензии, жалобы в Роспотребнадзор, ходатайства) на основе ФАКТОВ от пользователя.

# ПРАВИЛА
1. Ссылайся ТОЛЬКО на статьи из раздела «ДОСТУПНЫЕ СТАТЬИ».
2. Не придумывай адреса, реквизиты, названия госорганов.
3. Не давай устных консультаций — только документ.
4. Соблюдай структуру: шапка (кому/от кого), описательная часть, мотивировка (нормы права), требования, приложения.
5. Если фактов недостаточно — добавь раздел «РИСКИ».
6. Используй официально-деловой стиль.
7. Если предоставлен текст входящей претензии — составь именно ОТВЕТ на неё: поддержи или отклони требования, аргументируй, дай ссылки на закон.

# ДОСТУПНЫЕ СТАТЬИ
- ЗоЗПП: ст. 18, 19, 20, 21, 22, 23, 25, 29
- ГК РФ: ст. 309, 310, 330, 395, 1064
- ГПК РФ: ст. 131, 132
- КоАП РФ: ст. 14.8
- Постановление Пленума ВС №17 от 28.06.2012

# ФОРМАТ ВЫВОДА
Начинай сразу с заголовка документа.
После документа кратко перечисли:
- Какие статьи применены.
- Каких данных не хватило.
- Юридические риски.`
                            },
                            {
                                role: 'user',
                                content: fullContext
                            }
                        ],
                        temperature: 0.3,
                        max_tokens: 3000
                    })
                });

                if (!response.ok) {
                    let err = await response.json();
                    throw new Error(err.error?.message || 'Ошибка соединения. Код: ' + response.status);
                }

                let json = await response.json();
                lastDocument = json.choices[0].message.content;

                result.textContent = lastDocument;
                result.style.display = 'block';
                btnPdf.disabled = false;
                status.textContent = '✅ Готово. Вы можете скачать документ как PDF.';

            } catch (error) {
                status.innerHTML = '<span class="error">Ошибка: ' + error.message + '</span>';
            }

            btnAi.disabled = false;
            btnAi.textContent = '⚡ Сформировать документ через ИИ';
        }

        function downloadPDF() {
            if (!lastDocument) return;
            let printWindow = window.open('', '_blank', 'width=800,height=600');
            printWindow.document.write('<html><head><meta charset="UTF-8"><style>');
            printWindow.document.write('body { font-family: "Times New Roman", serif; font-size: 14pt; line-height: 1.5; padding: 30px 40px; white-space: pre-wrap; }');
            printWindow.document.write('</style></head><body>');
            printWindow.document.write(lastDocument.replace(/\n/g, '<br>'));
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            printWindow.focus();
            setTimeout(function() {
                printWindow.print();
            }, 500);
        }
    </script>

</body>
</html>
